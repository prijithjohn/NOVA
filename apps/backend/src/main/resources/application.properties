server.port=${SERVER_PORT:3001}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# AI provider — Ollama (local development defaults; override via environment variables)
nova.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
nova.ai.ollama.model=${OLLAMA_MODEL:llama3}
